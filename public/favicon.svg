<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" shape-rendering="crispEdges">
  <!-- The starship sprite: 5 x 8 EGA pixels, each twice as wide as tall, on black. -->
  <rect width="10" height="10" rx="1" fill="#000"/>
  <g fill="#555">
    <rect x="2" y="1" width="2" height="2"/>
    <rect x="6" y="1" width="2" height="2"/>
    <rect x="4" y="3" width="2" height="1"/>
    <rect x="2" y="4" width="2" height="1"/>
    <rect x="6" y="4" width="2" height="1"/>
    <rect x="0" y="5" width="2" height="4"/>
    <rect x="6" y="5" width="2" height="4"/>
  </g>
  <g fill="#aaa">
    <rect x="4" y="1" width="2" height="2"/>
    <rect x="4" y="4" width="2" height="1"/>
    <rect x="2" y="5" width="2" height="4"/>
    <rect x="4" y="5" width="2" height="2"/>
    <rect x="8" y="5" width="2" height="4"/>
  </g>
</svg>
